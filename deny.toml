[licenses]
version = 2
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0", "Unicode-DFS-2016", "ISC", "MPL-2.0", "Zlib"]

[[licenses.clarify]]
name = "ring"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

skip = [
    { crate = "bitflags@1",     reason = "used by `redox`, `security-framework` and `system-configuration`" },
    { crate = "hashbrown@0.12", reason = "used by `protobuf-parse`" },
    { crate = "heck@0.4",       reason = "used by `strum` and `sqlx`" },
    { crate = "indexmap@1",     reason = "used by `protobuf-parse`" },
    { crate = "syn@1",          reason = "used by `diff_derive`" },
]

skip-tree = [
    { crate = "windows-sys",     reason = "Several foundational crates are not yet up to date" },
    { crate = "windows-targets", reason = "Several foundational crates are not yet up to date" },
]

[advisories]
version = 2
ignore = [
    "RUSTSEC-2024-0436",  # paste unmaintained (dev dep only)
    # rustls-pemfile is unmaintained but comes transitively from reqwest 0.11.x
    # Will be resolved when upgrading to reqwest 0.12+ which uses rustls-pki-types
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained
    # gix-date vulnerability in dev dependency (gix 0.68.0)
    # Upgrading to gix 0.78+ requires significant changes; planned for future release
    "RUSTSEC-2025-0140",  # gix-date TimeBuf::as_str non-utf8 (dev dep only)
]

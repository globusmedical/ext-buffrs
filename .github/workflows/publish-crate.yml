name: publish-crate

# Publishes the buffrs crate to the globus cargo registry (JFrog Artifactory)
# for every gm/vX.Y.Z tag. It runs alongside release.yml, which builds the
# binaries and the GitHub release for the same tag.
#
# workflow_dispatch publishes an existing tag, for a release whose tag was
# pushed before this workflow existed or whose publish failed. Run it from
# main-gm and name the tag, e.g. gm/v1.2.10; the job checks out that tag.
#
# Publishing mirrors the shared rust-release workflow that grab and hush2 call
# (globusmedical/gm-github-actions, rust-release.yml@rust-release/v1): same
# secrets, same registry name, same cargo config and publish flags, and a
# version already in the registry is skipped instead of failing. The shared
# actions live in an internal repository, which a public repository cannot
# use, so the steps are inlined here.
on:
  push:
    tags:
    - "gm/v[0-9]+.[0-9]+.[0-9]+"
    - "gm/v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (gm/vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CRATE_NAME: buffrs
  REGISTRY_NAME: globus

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
    - name: Resolve the release tag
      id: tag
      shell: bash
      env:
        INPUT_TAG: ${{ inputs.tag }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          TAG="$INPUT_TAG"
        else
          TAG="$REF_NAME"
        fi
        if ! [[ "$TAG" =~ ^gm/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Refusing to publish '$TAG': expected gm/vX.Y.Z" >&2
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=${TAG#gm/v}" >> "$GITHUB_OUTPUT"

    - name: Checkout the release tag
      uses: actions/checkout@v4
      with:
        ref: refs/tags/${{ steps.tag.outputs.tag }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Check that the tag and Cargo.toml versions match
      shell: bash
      env:
        TAG_VERSION: ${{ steps.tag.outputs.version }}
      run: |
        set -euo pipefail
        PACKAGE_VERSION="$(cargo metadata --locked --no-deps --format-version 1 \
          | jq -er --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version')"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag version $TAG_VERSION does not match Cargo.toml version $PACKAGE_VERSION" >&2
          exit 1
        fi
        echo "Publishing $CRATE_NAME $PACKAGE_VERSION"

    # Same cargo configuration as the shared setup-jfrog-publishing action:
    # the globus registry with its index and token from the org secrets.
    - name: Configure the globus registry
      shell: bash
      env:
        REGISTRY_INDEX: ${{ secrets.CARGO_REGISTRY_GLOBUS_INDEX }}
        AUTH_TOKEN: ${{ secrets.CARGO_REGISTRY_GLOBUS_TOKEN }}
      run: |
        set -euo pipefail
        if [ -z "$REGISTRY_INDEX" ]; then
          echo "::error::CARGO_REGISTRY_GLOBUS_INDEX is empty or not available to this repository" >&2
          exit 1
        fi
        if [ -z "$AUTH_TOKEN" ]; then
          echo "::error::CARGO_REGISTRY_GLOBUS_TOKEN is empty or not available to this repository" >&2
          exit 1
        fi
        CARGO_CONFIG_DIR="${CARGO_HOME:-$HOME/.cargo}"
        mkdir -p "$CARGO_CONFIG_DIR"
        cat > "$CARGO_CONFIG_DIR/config.toml" << EOF
        [registry]
        default = "$REGISTRY_NAME"

        [registries.$REGISTRY_NAME]
        index = "$REGISTRY_INDEX"
        token = "$AUTH_TOKEN"
        EOF

    # The sparse index lists every published version, one JSON object per
    # line. 404 means the crate has never been published.
    - name: Check whether the version is already in the registry
      id: registry
      shell: bash
      env:
        VERSION: ${{ steps.tag.outputs.version }}
        REGISTRY_INDEX: ${{ secrets.CARGO_REGISTRY_GLOBUS_INDEX }}
        AUTH_TOKEN: ${{ secrets.CARGO_REGISTRY_GLOBUS_TOKEN }}
      run: |
        set -euo pipefail
        if [[ "$REGISTRY_INDEX" != sparse+* ]]; then
          # Only a sparse index can be read over plain HTTP; leave the
          # decision to cargo publish (handled in the next step).
          echo "::warning::Registry index is not a sparse index, publishing without a pre-check"
          echo "published=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        INDEX_URL="${REGISTRY_INDEX#sparse+}"
        INDEX_URL="${INDEX_URL%/}"
        # Crate names of four or more characters live under ab/cd/<name>.
        ENTRY_URL="$INDEX_URL/${CRATE_NAME:0:2}/${CRATE_NAME:2:2}/$CRATE_NAME"
        HTTP_CODE="$(curl -sS -o index.json -w '%{http_code}' -H "Authorization: $AUTH_TOKEN" "$ENTRY_URL" || echo 000)"
        case "$HTTP_CODE" in
          200)
            if jq -er --arg v "$VERSION" 'select(.vers == $v) | .vers' index.json > /dev/null 2>&1; then
              echo "::notice::$CRATE_NAME $VERSION is already in the $REGISTRY_NAME registry, skipping publish"
              echo "published=true" >> "$GITHUB_OUTPUT"
            else
              echo "published=false" >> "$GITHUB_OUTPUT"
            fi
            ;;
          404)
            echo "published=false" >> "$GITHUB_OUTPUT"
            ;;
          *)
            # Leave the decision to cargo publish, which reports an existing
            # version as "already exists" (handled in the next step).
            echo "::warning::Registry index returned HTTP $HTTP_CODE, publishing without a pre-check"
            echo "published=false" >> "$GITHUB_OUTPUT"
            ;;
        esac
        rm -f index.json

    # Same flags as the shared rust-publish-libraries action: CI and
    # release.yml build the code, so --no-verify skips the rebuild of the
    # packaged tarball.
    - name: Publish to the globus registry
      if: steps.registry.outputs.published != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.tag.outputs.version }}
      run: |
        set -euo pipefail
        if OUTPUT="$(cargo publish --locked --no-verify --registry "$REGISTRY_NAME" 2>&1)"; then
          echo "$OUTPUT"
          echo "::notice::Published $CRATE_NAME $VERSION to the $REGISTRY_NAME registry"
        elif echo "$OUTPUT" | grep -q "already exists"; then
          echo "$OUTPUT"
          echo "::notice::$CRATE_NAME $VERSION is already in the $REGISTRY_NAME registry, skipping publish"
        else
          echo "$OUTPUT" >&2
          exit 1
        fi
